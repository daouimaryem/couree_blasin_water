      - name: Install required Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy earthengine-api google-auth

      - name: Save Google Cloud credentials
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$EE_KEY" ]; then
            echo "⚠ Warning: EE_SERVICE_ACCOUNT_KEY secret is not set"
            exit 1
          fi
          echo "$EE_KEY" > gcp_key.json
          echo "✓ Service account credentials saved"
